behaviors:
  CarAgent:
    trainer_type: ppo

    # 20M-step plan, 128 hidden units, time_horizon=128 - reverted from the earlier 256/30M/1000
    # experiment back to this project's established baseline (matches every lr-sweep/sensor-test
    # run analyzed this session) specifically so the new reward-sweep results stay directly
    # comparable to that existing analysis.
    max_steps: 20000000
    time_horizon: 128
    summary_freq: 10000
    keep_checkpoints: 200
    checkpoint_interval: 100000

    hyperparameters:
      batch_size: 1024
      buffer_size: 8192
      learning_rate: 0.0003

    network_settings:
      hidden_units: 128
      num_layers: 2
      normalize: true

    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0

environment_parameters:
  # --- Core reward weights (car_component.cs / carAgent.cs) ---
  # Reward-sweep variant 1 (the new default): terminal -10 (was -15), time penalty -0.001 (was
  # -0.01), goal +4 with the 100-band checkpoint/partial reward summing to +1 (0.01/band) instead
  # of the old +5 (0.05/band) - approach_bonus (the one-time straight-on-approach bonus at goal
  # time, carAgent.cs:1090) left at 0, not part of this sweep. See hpc/reward_sweep.sh for variants
  # 2 (goal +5, no partial reward) and 3 (goal 0, partial reward sums to +5) alongside this one.
  reward_goal: 4.0
  reward_approach_bonus: 0.0
  reward_terminal_penalty: -10.0

  # Flat per-step time cost, no compounding (growth left at 0 — see the reward-balance
  # discussion: a growing rate made a full unsuccessful episode cost far more than crashing).
  reward_time_penalty: -0.001
  reward_time_penalty_growth: 0.0

  # Checkpoint reward: spawn-to-goal distance is divided into 100 equal bands. The car's
  # minimum distance-to-goal so far this episode only ever shrinks, so each band is awarded
  # exactly once, whenever that minimum first crosses into it. Tune this value to try
  # different checkpoint reward magnitudes (reward-sweep variant 1: sums to 1.0 across all 100
  # checkpoints, down from the old 5.0 - see hpc/reward_sweep.sh for variants 2/3).
  reward_checkpoint: 0.01

  # --- Idle penalty (escalating, not flat) -----------------------------------------------
  # Standing still costs the same flat reward_time_penalty as driving, so a policy that's
  # unsure how to proceed (e.g. can't see a safe way around a Terminal tile) can just wait the
  # episode out for close to free. This adds an extra, GROWING penalty once the car's speed
  # (carAgent.cs OnActionReceived, rb.linearVelocity.magnitude) has stayed below
  # idle_speed_threshold for more than idle_grace_steps consecutive decision steps in a row -
  # the counter resets the instant speed exceeds the threshold again. idle_speed_threshold
  # defaults far below car_component's reverseEngageSpeed (0.5 m/s), so a normal brake-to-
  # shift-gear moment never trips it; idle_grace_steps additionally absorbs a brief full stop.
  # Growing (idle_penalty_growth), not flat, so a frozen policy can't just tolerate a fixed
  # cost for the rest of the episode - the longer it stands still, the worse it gets. Set
  # idle_penalty_enabled to 0 to disable entirely (default off).
  idle_penalty_enabled: 0
  idle_speed_threshold: 0.001
  idle_grace_steps: 20
  idle_penalty_base: -0.02
  idle_penalty_growth: 0.05

  # --- Terminal penalty escalation (one-time step-up, not a gradual ramp) ---
  # Once GLOBAL training step terminal_penalty_escalation_step is reached, reward_terminal_penalty
  # switches permanently to terminal_penalty_escalated_value for the rest of that run. Tightens
  # safety once the agent should already drive competently, instead of punishing crashes this
  # harshly from the very first, still-clumsy episodes. Step-based (not a rolling goal-rate
  # window) specifically so every parallel worker escalates at essentially the same point:
  # Academy.Instance.TotalStepCount is per-process, but stays in close lockstep across workers
  # since they're all paced by the same DecisionPeriod - unlike goal-rate, which could vary
  # wildly worker-to-worker and let some drift millions of steps ahead of others before each
  # independently crossed its own threshold. Same GLOBAL-steps/training_num_envs convention as
  # the bootstrap stage steps below (divided by training_num_envs, multiplied by DecisionPeriod,
  # internally in carAgent.cs). Set terminal_penalty_escalation_enabled to 0 to disable entirely
  # (default off).
  terminal_penalty_escalation_enabled: 0
  terminal_penalty_escalation_step: 10000000
  terminal_penalty_escalated_value: -15.0

  # --- Adaptive Lagrangian-style penalty (replaces manual reward_terminal_penalty tuning) -----
  # Instead of a fixed hand-picked reward_terminal_penalty (see the PENALTY_MODE grid search in
  # hpc/train_grid.sh), lambda self-tunes toward lagrangian_target_crash_rate via dual ascent -
  # every summary window (see stats_patched.py's LATEST_CRASH_RATE /
  # trainer_controller_patched.py's _update_lagrangian_penalty):
  #   lambda <- clamp(lambda + lagrangian_lambda_lr * (measured_crash_rate - target), 0, lambda_max)
  # then pushed to Unity as reward_terminal_penalty = -lambda, via the exact same
  # EnvironmentParameters wire reward_terminal_penalty already reads every episode
  # (carAgent.cs UpdateRewardWeights) - no C# changes needed, no cost critic, this does NOT touch
  # PPO's advantage calculation. This is an adaptive-penalty APPROXIMATION of Lagrangian PPO, not
  # the textbook dual-critic method - be precise about that distinction in any thesis writeup.
  #
  # target_crash_rate MUST be a realistic target for this task, not an aspirational one - it's not
  # a hard cap, it's the rate the *unconstrained* baseline policy naturally converges to under
  # dual ascent. Set it far below what a functional policy can actually achieve (5% was tried
  # against a baseline that converges to ~15-20% during training) and lambda has nothing to
  # equilibrate against: rate > target on almost every summary window forever, so lambda climbs
  # without bound, the resulting penalty comes to dwarf reward_goal, and the policy's only rational
  # response is to stop attempting the task at all (observed: lambda reached 100-500+, policy
  # collapsed to ~0% goal rate on grid runs 3-5). lambda_max is now also clamped (previously only
  # floored at 0) as a hard backstop against this even with a still-too-aggressive target.
  #
  # Also gated to only start once the bootstrap curriculum (bootstrap_stage_*_steps below)
  # finishes: during bootstrap the crash rate reflects artificial drills (esp. DeadEnd's walled
  # reverse-out pocket), not the real task, and is naturally far higher than any sane target -
  # letting lambda react to that early noise was part of what caused the runaway climb above.
  #
  # MUTUALLY EXCLUSIVE with terminal_penalty_escalation_enabled above - both write
  # reward_terminal_penalty, so enabling both means they fight over the same value. Requires
  # trainer_controller_patched.py to be bound over mlagents/trainers/trainer_controller.py (same
  # apptainer --bind pattern already used for stats_patched.py) - without that bind, this whole
  # block is silently inert (samplers.get("lagrangian_penalty_enabled") never gets read by
  # anything). Set lagrangian_penalty_enabled to 0 to disable entirely (default off).
  lagrangian_penalty_enabled: 0
  lagrangian_target_crash_rate: 0.15
  lagrangian_lambda_init: 5.0
  lagrangian_lambda_lr: 10.0
  lagrangian_lambda_max: 30.0

  # --- MaxStep-rate lagrangian, drives reward_time_penalty (NOT reward_maxstep_penalty) ----------
  # Same _update_lagrangian_constraint machinery as the crash lagrangian above (trainer_controller_
  # patched.py), independent lambda/target, targeting maxstep_rate instead of crash_rate and
  # pushing reward_time_penalty (the flat PER-STEP cost) instead of reward_terminal_penalty. An
  # earlier version of this idea targeted reward_maxstep_penalty (a one-time end-of-episode charge)
  # and was removed - "never converged to a useful policy" (see carAgent.cs's rwMaxStepPenalty
  # comment). This version reacts through the continuous per-step lever instead, on the theory that
  # a one-shot terminal charge gives no gradient except right at the 5000th step, while the per-step
  # cost is felt (and can be adapted) throughout the whole episode.
  # lambda_init=0.002 deliberately matches this round's fixed reward_time_penalty baseline (-0.002)
  # so an enabled run starts exactly where the fixed-penalty comparison combos sit, then adapts from
  # there - lambda_lr/lambda_max are UNVALIDATED first guesses (same calibrate-against-a-real-run
  # caveat as every other Lagrangian block here), scaled down ~1000x from the crash lagrangian's
  # lr=10.0/max=30.0 to match reward_time_penalty's tiny magnitude versus reward_terminal_penalty's
  # -10-ish scale - watch Environment/Lagrangian Lambda/maxstep_timepenalty in TensorBoard for
  # runaway growth same as the others. MUTUALLY EXCLUSIVE with adaptive_step_budget_enabled in the
  # sense that both react to maxstep_rate, but they push different things (a reward coefficient
  # here vs the actual episode step budget there) and CAN run simultaneously if you want to test
  # that combination on purpose - not automatically incompatible the way lagrangian_penalty_enabled
  # and terminal_penalty_escalation_enabled are (those both write the same field).
  lagrangian_maxstep_enabled: 0
  lagrangian_target_maxstep_rate: 0.15
  lagrangian_maxstep_lambda_init: 0.002
  lagrangian_maxstep_lambda_lr: 0.01
  lagrangian_maxstep_lambda_max: 0.01

  # --- Dense forward-sensor terminal-avoidance shaping (potential-based, Ng/Harada/Russell 1999) -
  # ADDITIVE to lagrangian_penalty_*/reward_terminal_penalty above, not a replacement: that one
  # only fires once, at the moment of an actual collision - this one fires every decision step the
  # car is approaching or retreating from a Terminal tile, well before any collision happens, so it
  # gives the policy gradient earlier than a sparse collision-only penalty can.
  #
  # CarSensor's Fan shape has a dead-ahead LINE running through it: the on-axis (angle=0) point of
  # each front arc, plus the straight-ahead fill points between rings (pointsBetweenRing1And2/
  # pointsBetweenRing2And3) - at the current Inspector config (front points 3/5/7, fill points
  # 1/3) that's exactly 7 points at 3/6/9/12/15/18/21m (see CarSensor.isForwardLineSensor). Define
  # Phi(s) = (of those, how many currently read Terminal) / 7 - a "danger potential" in [0, 1].
  # Every decision step, carAgent.cs applies reward = sensor_terminal_penalty_lambda *
  # (Phi(s_now) - Phi(s_previous)) - i.e. lambda itself is negative (same "already a penalty value"
  # convention as reward_terminal_penalty), so an INCREASING Phi (approaching, more of the 7 points
  # newly see Terminal) is penalized, a DECREASING Phi (retreating) is rewarded by the same amount.
  # This form is provably policy-invariant reward shaping: because it's the CHANGE in Phi (not its
  # absolute level) that's rewarded, a full approach-then-retreat telescopes to exactly zero net
  # reward regardless of path length or how many steps it takes, and the total contribution over an
  # entire episode is bounded to [-|lambda|, +|lambda|] (Phi only ever ranges 0 to 1) - it cannot
  # blow up with episode length the way the crash lagrangian's runaway-lambda failure mode did.
  #
  # sensor_terminal_lagrangian_enabled runs its OWN independent dual-ascent lambda (see
  # trainer_controller_patched.py's _update_lagrangian_penalties, "sensor_terminal" constraint) -
  # deliberately separate from lagrangian_penalty_*'s "crash" lambda/target, since this constraint
  # targets a genuinely different metric: mean Phi across all decision steps in a summary window
  # (stats_patched.py's LATEST_SENSOR_TERMINAL_EXPOSURE, i.e. Custom/ForwardLineTerminalExposure's
  # mean) - NOT crash rate. The shaping reward ITSELF can't serve as its own dual-ascent target
  # since it telescopes toward ~0 over a full approach/retreat even for a policy that spends a lot
  # of time right at the edge of danger; mean exposure instead directly measures how much time, on
  # average, the policy spends with forward sensors seeing Terminal, independent of the reward's
  # own cancellation. sensor_terminal_target_exposure is an UNVALIDATED starting guess (same
  # calibrate-against-a-real-run caveat as lagrangian_target_crash_rate above) - watch
  # "Environment/Lagrangian Lambda/sensor_terminal" in TensorBoard for runaway growth the same way,
  # and lower the target or raise sensor_terminal_lambda_max if it climbs without bound. Also gated
  # behind the bootstrap curriculum finishing, same rationale as lagrangian_penalty_* above. Set
  # sensor_terminal_lagrangian_enabled to 0 to disable entirely (default off) - fully inert without
  # trainer_controller_patched.py bound, same as lagrangian_penalty_enabled.
  sensor_terminal_lagrangian_enabled: 0
  sensor_terminal_target_exposure: 0.15
  sensor_terminal_lambda_init: 1.0
  sensor_terminal_lambda_lr: 10.0
  sensor_terminal_lambda_max: 30.0

  # The actual pushed multiplier carAgent.cs reads (see rwSensorTerminalPenalty above) - already
  # negative ("a penalty value"), same convention as reward_terminal_penalty. 0 = inert (matches
  # the C# default when this key is absent entirely). Leave at 0 and use
  # sensor_terminal_lagrangian_enabled above for the adaptive version; set this directly to a fixed
  # negative value instead (e.g. -1.0) to test a plain, non-adaptive constant multiplier - the two
  # are mutually exclusive in the sense that enabling the lagrangian will overwrite whatever's set
  # here every summary window.
  sensor_terminal_penalty_lambda: 0.0

  # Exponent applied to the linear (N-rank)/N severity fraction in CarSensor.
  # GetNearestForwardLineTerminalSeverity - Mathf.Pow(linear, exponent). 1.0 (default) is the
  # original plain linear scale, unchanged: rank 0..6 (nearest..farthest of 7) give 1.0, 0.857,
  # 0.714, 0.571, 0.429, 0.286, 0.143. exponent > 1 skews weight toward the near end instead - the
  # nearest point always stays exactly 1.0 (1^x = 1), only farther points shrink:
  #   exponent=2: 1.0, 0.735, 0.510, 0.327, 0.184, 0.082, 0.020
  #   exponent=3: 1.0, 0.630, 0.364, 0.187, 0.079, 0.023, 0.003
  # Motivated by real driving urgency being nonlinear in distance (a hazard 3m out deserves
  # outsized concern vs one 18m out) - tradeoff is a weaker early-warning gradient from the farther
  # points the higher this goes, potentially undercutting the point of having 7 graduated points
  # instead of 1. Applies to BOTH the per-step reward shaping AND the episode-cumulative
  # Custom/ForwardLineTerminalExposure metric (same phi value feeds both).
  sensor_severity_exponent: 1.0

  # Flat, fixed penalty applied once when a MaxStepReached timeout fires (carAgent.cs FixedUpdate),
  # on top of whatever flat reward_time_penalty/idle penalty already accumulated over the episode.
  # 0 by default (no behavior change). This used to also be adaptively auto-tuned by a Lagrangian
  # dual-ascent mechanism (lagrangian_maxstep_*, mirroring lagrangian_penalty_* below) - removed,
  # it never converged to a useful policy; this is now purely a manual override.
  reward_maxstep_penalty: 0.0

  # --- Adaptive step-time budget (self-paced curriculum, NOT a Lagrangian penalty) -------------
  # Agent.MaxStep (carAgent.cs UpdateRewardWeights - see max_step_budget below) adjusts itself
  # based on the maxstep-timeout rate (maxstep_target_rate below), but this is a different
  # technique from the Lagrangian-style penalty below: it changes the episode's actual time
  # budget/task structure, not a reward coefficient - keep it conceptually separate in any writeup
  # even though the update-rule shape looks similar:
  #   max_step_budget <- clamp(max_step_budget + adaptive_step_budget_lr *
  #                             (maxstep_rate - maxstep_target_rate), min, max)
  # i.e. too many timeouts -> more time given; comfortably under budget -> tightened for
  # efficiency. Changing episode length mid-training is more disruptive than a reward tweak (the
  # value function implicitly learns under whatever horizon it's been trained on), hence the
  # min/max clamp - this can never shrink or grow unboundedly. adaptive_step_budget_lr=2000.0 is
  # an unvalidated starting guess (same caveat as lagrangian_lambda_lr) - calibrate against real
  # maxstep-rate variance from a smoke test. Set adaptive_step_budget_enabled to 0 to disable
  # entirely (default off); max_step_budget still works as a plain fixed override of the Agent's
  # Inspector-set MaxStep (5000) even with the adaptive mechanism off.
  adaptive_step_budget_enabled: 0
  maxstep_target_rate: 0.15
  max_step_budget: 5000
  adaptive_step_budget_lr: 2000.0
  adaptive_step_budget_min: 2500
  adaptive_step_budget_max: 8000

  # --- Goal reward escalation (one-time step-up, not a gradual ramp) ---
  # Same mechanism as terminal_penalty_escalation above, applied to reward_goal instead: once
  # GLOBAL training step goal_reward_escalation_step is reached, reward_goal switches permanently
  # to goal_reward_escalated_value for the rest of that run. Lets a run start with a smaller goal
  # reward (so early training isn't dominated by the sparse goal payoff over the denser approach/
  # checkpoint shaping) and step it up once the agent already drives competently. Set
  # goal_reward_escalation_enabled to 0 to disable entirely (default off).
  goal_reward_escalation_enabled: 0
  goal_reward_escalation_step: 10000000
  goal_reward_escalated_value: 5.0

  # IMPORTANT: Academy.Instance.TotalStepCount is per-process, not aggregated across --num-envs
  # workers, so this MUST match whatever --num-envs value you pass on the mlagents-learn command
  # line, or the bootstrap curriculum stages below will silently run too long/short. Leave at 1
  # if you run with a single environment (i.e. no --num-envs flag, or --num-envs=1).
  training_num_envs: 32

  # --- Bootstrap curriculum -------------------------------------------------------------
  # For the very first steps of training (before goal placement falls back to pure
  # full-random), force the goal through four easy, sequential drills so the policy learns
  # basic controls while it's still close to random exploration:
  #   1. Front   - goal straight ahead: throttle + steering toward a target.
  #   2. Behind  - goal straight behind: forces reverse-gear engagement / backing up. The
  #      approach-bonus reward is flipped to reward reversing (not forward motion) during
  #      this stage only (see carAgent.cs OnTriggerEnter) - this directly discourages the
  #      agent from "cheating" the goal with a forward-facing 180 turn instead of genuinely
  #      learning reverse.
  #   3. DeadEnd - goal placed behind, beyond a narrow one-cell-wide pocket of Terminal tiles
  #      built straight ahead of the spawn (too narrow to arc a forward U-turn inside). The
  #      only way out without ending the episode is to reverse straight back the way it drove
  #      in - the "stronger fix" the Behind stage's single wall alone couldn't teach, since a
  #      lone wall can usually just be steered around instead of reversed away from.
  #   4. Side    - goal at a randomised side angle/distance: variety, bridging toward full
  #      random placement.
  # All step counts below are GLOBAL steps (summed across all --num-envs workers, matching
  # total_training_steps' convention) and are divided by training_num_envs internally.
  # Deliberately short - this is a quick "learn the controls" primer, not a long-running
  # curriculum. Once all four stages finish, goal placement is pure full-random across the
  # whole goal area. While ANY of the four stages is active, all grid tiles are also forced
  # to TileType.Asphalt (no Terminal/Slippery/SpeedLimited/Gravel) via GridManager.forceAllNormal,
  # sharing this same enabled flag and stage-steps budget rather than being separately
  # configurable. Set bootstrap_curriculum_enabled to 0 to disable entirely.
  bootstrap_curriculum_enabled: 1

  # Approach-bonus override for the Front/Behind stages only (carAgent.cs UpdateRewardWeights).
  # Goal is directly ahead/behind during these two stages, so a stronger pull toward driving/
  # reversing straight at it helps basic control learning land faster. DeadEnd/Side stages and
  # beyond (including full-random placement once bootstrap ends) use reward_approach_bonus as
  # normal - DeadEnd's final approach into the goal is a normal forward drive, once the car has
  # already backed clear of the pocket.
  bootstrap_approach_bonus: 3.0

  # Stage 1: Front.
  bootstrap_stage_front_steps: 20000
  bootstrap_front_distance: 6

  # Stage 2: Behind (reverse-gear drill; approach bonus flipped for this stage).
  bootstrap_stage_behind_steps: 20000
  bootstrap_behind_distance: 6

  # Probability a Behind-stage episode spawns with reverse gear already engaged (carAgent.cs
  # OnEpisodeBegin), so the policy directly experiences what reverse does (acceleration -> backward
  # motion -> reward) instead of only discovering it via random exploration of the gear-toggle
  # action. The policy's own discrete gear action can still flip it back on step 1; this just
  # raises how often reverse actually gets tried. Decays linearly from _start to _end over the
  # course of the Behind stage: near-certain at first (isolate "accelerate while already in
  # reverse" with zero gear-decision confusion), lower by the end (forces practicing the actual
  # decision to shift into reverse before bootstrap ends). Set both to 0 to disable entirely.
  bootstrap_behind_spawn_reverse_prob_start: 1.0
  bootstrap_behind_spawn_reverse_prob_end: 0.3

  # Distance (world units, in front of spawn) at which a Behind-stage episode forces a Terminal
  # tile, overriding whatever forceAllNormal/the tile-mix would otherwise have generated there
  # (carAgent.cs OnEpisodeBegin, GridManager.SetTileTypeAt). Makes driving forward - instead of
  # reversing toward the goal behind - end the episode immediately: a much stronger, unambiguous
  # signal than bootstrap_behind_spawn_reverse_prob_start/_end above, which only nudges the odds of trying
  # reverse rather than actively punishing forward. Keep this comfortably above half of
  # GridManager's cellSize so it can never land in the same cell as the spawn point itself.
  bootstrap_behind_terminal_distance: 4

  # Stage 3: DeadEnd (reverse-out-of-a-pocket drill). Spawn heading is snapped to one of the 4
  # grid-aligned cardinal directions (carAgent.cs OnEpisodeBegin) so the pocket below lines up
  # exactly with whole grid cells. bootstrap_deadend_depth_cells is how many cells deep the
  # pocket extends ahead of the (mouth-referenced) spawn point - walls flank both sides of that
  # whole depth, plus a cap one cell further - and the car itself is spawned near the closed
  # end of it (not at the open mouth), so it actually has to recognize it's trapped and reverse
  # a meaningful distance back out, rather than starting already at the exit. Keep this at
  # least 1 - narrower/shallower pockets are easier, but a depth of 1 already blocks any forward
  # U-turn given the 1-cell pocket width. Goal distance/angle spread control how far behind the
  # mouth (and how much side variety) the goal lands - angle 180 = straight behind, so a spread
  # of 60 keeps it within 120-240 degrees, always comfortably in the rear hemisphere away from
  # the pocket.
  bootstrap_stage_deadend_steps: 20000
  bootstrap_deadend_depth_cells: 3
  bootstrap_deadend_goal_distance_min: 10
  bootstrap_deadend_goal_distance_max: 18
  bootstrap_deadend_goal_angle_spread_deg: 60

  # Same reverse-gear-spawn trick as bootstrap_behind_spawn_reverse_prob_start/_end above,
  # applied to the DeadEnd stage - except this one decays all the way to 0, not to a nonzero
  # floor. DeadEnd is the last bootstrap stage that has anything to do with reversing; Side and
  # full-random placement afterward offer no assistance at all, so by the time this stage ends
  # the policy needs to reliably decide to shift into reverse entirely on its own (from
  # wall-sensor cues, since unlike Behind the goal here isn't simply placed behind the car).
  bootstrap_deadend_spawn_reverse_prob_start: 1.0
  bootstrap_deadend_spawn_reverse_prob_end: 0.0

  # Stage 4: Side (randomised angle 0=front/180=behind, mirrored left/right, plus randomised
  # distance, each re-rolled every episode in this stage).
  bootstrap_stage_side_steps: 20000
  bootstrap_side_distance_min: 8
  bootstrap_side_distance_max: 15
  bootstrap_side_angle_min_deg: 30
  bootstrap_side_angle_max_deg: 150

  # --- Voronoi near-goal ramp (post-bootstrap only, mapSource=Voronoi) ------------------------
  # Full-random goal placement on a Voronoi road map is constrained to Asphalt cells within a
  # network of curving roads (see grid_manager.cs SpawnableTileType/carAgent.cs IsSpawnableTile) -
  # unlike Perlin's open blobs, a genuinely random point on that network can be very far from
  # spawn the instant bootstrap ends, a sudden difficulty spike right after the controls-only
  # curriculum above. This caps the candidate goal's distance from spawn, starting tight
  # (voronoi_near_goal_distance_start) and relaxing linearly to voronoi_near_goal_distance_end
  # over voronoi_near_goal_steps GLOBAL steps (same convention as every step count above - divided
  # by training_num_envs internally). Has no effect under mapSource=Perlin. Set
  # voronoi_near_goal_enabled to 0 to disable entirely (default off).
  voronoi_near_goal_enabled: 0
  voronoi_near_goal_steps: 5000000
  voronoi_near_goal_distance_start: 15.0
  voronoi_near_goal_distance_end: 100.0

  # Train/validation map split (mapSource=Voronoi only). 0 (default) = load from
  # Resources/Maps/VoronoiTrain, as ordinary training always should. 1 = load from
  # Resources/Maps/VoronoiVal instead - a held-out set of maps never trained on, so
  # eval_checkpoints.py can force it via the EnvironmentParametersChannel to measure
  # generalisation instead of memorisation of the training pool. Never set this to 1 for an
  # actual training run - leave at 0 here; it exists for the eval script to override at runtime.
  use_validation_maps: 0
